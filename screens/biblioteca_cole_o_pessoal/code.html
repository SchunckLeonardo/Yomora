<body class="bg-surface text-on-surface font-body-ui min-h-screen pb-[100px] antialiased">
<!-- Header -->
<header class="flex justify-between items-center w-full px-margin-standard pt-12 pb-4 bg-surface/80 backdrop-blur-md sticky top-0 z-40 transition-shadow" id="main-header">
<h1 class="font-display-title text-display-title text-serene-teal">Sua Biblioteca</h1>
<div class="flex gap-gutter items-center text-primary">
<button class="p-2 hover:opacity-80 transition-opacity">

</button>
<button class="p-2 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="tune">tune</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="w-full max-w-screen-md mx-auto">

<div class="px-margin-standard pt-stack-sm mb-stack-md flex gap-8 overflow-x-auto hide-scrollbar border-b border-surface-variant relative">
<button class="font-callout text-callout text-serene-teal pb-3 relative whitespace-nowrap active-tab">

</button>
<button class="font-callout text-callout text-on-surface-variant pb-3 whitespace-nowrap hover:text-on-surface transition-colors">
                Quero ler

<button class="font-callout text-callout text-on-surface-variant pb-3 whitespace-nowrap hover:text-on-surface transition-colors">
                Finalizados
            </button>
</div>

<button class="px-4 py-2 rounded-full bg-surface-container-highest text-on-surface-variant font-label-caps text-label-caps whitespace-nowrap flex items-center gap-1 hover:bg-surface-dim transition-colors shadow-sm">
                Gêneros <span class="material-symbols-outlined text-[16px]">expand_more</span>
</button>
<button class="px-4 py-2 rounded-full bg-surface-container-highest text-on-surface-variant font-label-caps text-label-caps whitespace-nowrap hover:bg-surface-dim transition-colors shadow-sm">

                Autores
            </button>
</div>

</div>

</div>

<div class="h-full bg-progress-gold w-[12%] rounded-full shadow-[0_0_8px_rgba(212,175,55,0.5)]"></div>
</div>
</div>
</div>
<!-- Book 3 -->

<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Sua estante está vazia</h3>

<button class="bg-serene-teal text-on-primary font-callout text-callout px-8 py-4 rounded-full shadow-[0_4px_12px_rgba(44,74,82,0.2)] hover:bg-primary transition-colors active:scale-95 duration-200">

<!-- Item 1: Hoje -->
<a class="flex flex-col items-center justify-center text-interface-gray dark:text-outline hover:text-primary dark:hover:text-primary-fixed-dim w-16 group transition-colors" href="#">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform duration-200" data-icon="calendar_today">calendar_today</span>
<span class="font-label-caps text-label-caps opacity-80">Hoje</span>
</a>
<!-- Item 2: Descobrir -->
<a class="flex flex-col items-center justify-center text-interface-gray dark:text-outline hover:text-primary dark:hover:text-primary-fixed-dim w-16 group transition-colors" href="#">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform duration-200" data-icon="explore">explore</span>
<span class="font-label-caps text-label-caps opacity-80">Descobrir</span>
</a>
<!-- Item 3: Ler -->
<a class="flex flex-col items-center justify-center text-interface-gray dark:text-outline hover:text-primary dark:hover:text-primary-fixed-dim w-16 group transition-colors" href="#">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform duration-200" data-icon="menu_book">menu_book</span>
<span class="font-label-caps text-label-caps opacity-80">Ler</span>
</a>
<!-- Item 4: Comunidade -->
<a class="flex flex-col items-center justify-center text-interface-gray dark:text-outline hover:text-primary dark:hover:text-primary-fixed-dim w-16 group transition-colors" href="#">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform duration-200" data-icon="group">group</span>
<span class="font-label-caps text-label-caps opacity-80">Comunidade</span>
</a>
<!-- Item 5: Biblioteca (ACTIVE) -->
<a class="flex flex-col items-center justify-center text-serene-teal dark:text-primary-fixed w-16 scale-110 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1 drop-shadow-sm" data-icon="library_books" data-weight="fill" style="font-variation-settings: 'FILL' 1;">library_books</span>
<span class="font-label-caps text-label-caps">Biblioteca</span>
</a>
</nav>
<script>
        // Simple script to add a subtle shadow to header on scroll
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            if (window.scrollY > 10) {
                header.classList.add('shadow-[0_4px_24px_rgba(0,0,0,0.04)]');
            } else {
                header.classList.remove('shadow-[0_4px_24px_rgba(0,0,0,0.04)]');
            }
        });
    </script>
