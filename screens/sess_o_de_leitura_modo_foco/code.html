<script>
        // Simple script to handle hiding UI for maximum focus
        document.addEventListener('DOMContentLoaded', () => {
            const btnHide = document.getElementById('btn-hide-ui');
            const header = document.getElementById('controls-header');
            const footer = document.getElementById('controls-footer');
            const content = document.getElementById('focus-content');
            let uiHidden = false;

            btnHide.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleUI();
            });

            // Tap anywhere to bring UI back if hidden
            document.body.addEventListener('click', () => {
                if (uiHidden) toggleUI();
            });

            function toggleUI() {
                uiHidden = !uiHidden;
                if (uiHidden) {
                    header.style.opacity = '0';
                    footer.style.opacity = '0';
                    header.style.pointerEvents = 'none';
                    footer.style.pointerEvents = 'none';
                    content.classList.add('scale-105');
                } else {
                    header.style.opacity = '1';
                    footer.style.opacity = '1';
                    header.style.pointerEvents = 'auto';
                    footer.style.pointerEvents = 'auto';
                    content.classList.remove('scale-105');
                }
            }
        });
    </script>
