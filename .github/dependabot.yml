version: 2

updates:
  - package-ecosystem: gradle
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    groups:
      backend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Sao_Paulo
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
