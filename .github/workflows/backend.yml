name: Backend
on:
  pull_request:
    paths: ["services/api/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Lint, migrations and tests
        run: ./gradlew clean lint test
      - name: Build bootable artifact
        run: ./gradlew bootJar

