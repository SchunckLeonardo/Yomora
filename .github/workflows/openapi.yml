name: OpenAPI
on:
  pull_request:
    paths: ["contracts/openapi/**", ".github/workflows/openapi.yml"]
  push:
    branches: [main]
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate contract
        run: npx --yes @redocly/cli@1.34.2 lint contracts/openapi/yomora-api.yaml
