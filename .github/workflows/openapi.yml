name: OpenAPI
on:
  pull_request:
    paths: ["contracts/openapi/**", ".github/workflows/openapi.yml"]
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate contract
        run: npx --yes @redocly/cli@1.34.2 lint contracts/openapi/yomora-api.yaml
