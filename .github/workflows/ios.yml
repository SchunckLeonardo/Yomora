name: iOS
on:
  pull_request:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
permissions: {}
jobs:
  test:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Prepare Simulator
        id: simulator
        run: |
          xcrun simctl list > /dev/null
          simulator_id="$(xcrun simctl create 'Yomora CI' \
            'com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro' \
            'com.apple.CoreSimulator.SimRuntime.iOS-18-5')"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: apps/ios
        run: >-
          xcodebuild test -project Yomora.xcodeproj -scheme Yomora
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          CODE_SIGNING_ALLOWED=NO
