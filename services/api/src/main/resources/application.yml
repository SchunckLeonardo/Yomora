spring:
  application:
    name: yomora-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/yomora}
    username: ${DATABASE_USER:yomora}
    password: ${DATABASE_PASSWORD:yomora_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=15m

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

yomora:
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
  external-token-encryption-key: ${EXTERNAL_TOKEN_ENCRYPTION_KEY:local-development-external-token-key}
  apple:
    enabled: ${APPLE_SIGN_IN_ENABLED:false}
    client-id: ${APPLE_CLIENT_ID:app.yomora.ios}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
    jwk-set-uri: ${APPLE_JWK_SET_URI:https://appleid.apple.com/auth/keys}
  security:
    issuer: ${JWT_ISSUER:yomora-local}
    secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
