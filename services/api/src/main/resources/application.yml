spring:
  application:
    name: yomora-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/yomora}
    username: ${DATABASE_USER:yomora}
    password: ${DATABASE_PASSWORD:yomora_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=15m

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

yomora:
  security:
    issuer: ${JWT_ISSUER:yomora-local}
    secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  moderation:
    admin-user-ids: ${YOMORA_ADMIN_USER_IDS:}
  storage:
    profile-photos:
      bucket: ${AWS_S3_AVATAR_BUCKET:}
      region: ${AWS_REGION:us-east-1}
      endpoint: ${AWS_S3_ENDPOINT:}
      path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
