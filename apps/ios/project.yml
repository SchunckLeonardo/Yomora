name: Yomora
options:
  bundleIdPrefix: app.yomora
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Yomora:
    type: application
    platform: iOS
    sources:
      - Yomora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yomora.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Yomora
        INFOPLIST_KEY_API_BASE_URL: http://localhost:8080
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - YomoraTests
        - YomoraUITests
  YomoraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - YomoraTests
    dependencies:
      - target: Yomora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yomora.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  YomoraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - YomoraUITests
    dependencies:
      - target: Yomora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yomora.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
