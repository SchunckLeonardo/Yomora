name: Yomora
options:
  bundleIdPrefix: app.yomora
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
fileGroups:
  - Config
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Yomora:
    type: application
    platform: iOS
    sources:
      - Yomora
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yomora.ios
        DEVELOPMENT_TEAM: FMWWTVS6HZ
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/AppInfo.plist
        CODE_SIGN_ENTITLEMENTS: Yomora/Yomora.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: YomoraLiveActivity
        embed: true
    scheme:
      testTargets:
        - YomoraTests
        - YomoraUITests
  YomoraLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - YomoraLiveActivity
      - Yomora/Core/Utilities/ReadingActivityAttributes.swift
    info:
      path: YomoraLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Yomora
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yomora.ios.liveactivity
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  YomoraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - YomoraTests
    dependencies:
      - target: Yomora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yomora.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  YomoraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - YomoraUITests
    dependencies:
      - target: Yomora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yomora.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
