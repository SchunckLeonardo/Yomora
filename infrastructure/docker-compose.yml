services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yomora}
      POSTGRES_USER: ${POSTGRES_USER:-yomora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yomora_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - yomora-postgres:/var/lib/postgresql/data
      - ./env:/demo:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../services/api
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/yomora}
      DATABASE_USER: ${DATABASE_USER:-yomora}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-yomora_local}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32-bytes}
      JWT_ISSUER: ${JWT_ISSUER:-yomora-local}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      YOMORA_ADMIN_USER_IDS: ${YOMORA_ADMIN_USER_IDS:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_AVATAR_BUCKET: ${AWS_S3_AVATAR_BUCKET:-}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_PATH_STYLE_ACCESS: ${AWS_S3_PATH_STYLE_ACCESS:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  adminer:
    image: adminer:5
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres

volumes:
  yomora-postgres:
